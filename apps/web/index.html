<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agiwar — doctrine RTS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0b0f14; color: #cdd6e0; }
      #app { display: grid; grid-template-columns: 332px 1fr; grid-template-rows: 1fr 248px; height: 100vh; }
      #left { grid-column: 1; grid-row: 1 / 3; border-right: 1px solid #1d2733; padding: 10px; background: #0a0e13; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
      #left h4 { margin: 0; font-size: 12px; letter-spacing: .3px; }
      #stage { position: relative; grid-column: 2; grid-row: 1; overflow: hidden; min-height: 0; }
      #controls { grid-column: 2; grid-row: 2; display: flex; gap: 10px; padding: 10px; border-top: 1px solid #1d2733; overflow-x: auto; align-items: stretch; background: #0a0e13; }
      .panel { border: 1px solid #1d2733; border-radius: 6px; padding: 8px; min-width: 224px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
      #camps { display: flex; gap: 10px; }
      .panel h4 { margin: 0; font-size: 12px; letter-spacing: .3px; }
      textarea { width: 100%; flex: 1; min-height: 64px; background: #0e141b; color: #cdd6e0; border: 1px solid #243140; border-radius: 4px; padding: 6px; resize: none; font: inherit; }
      button { background: #1b2532; color: #cdd6e0; border: 1px solid #2c3a4c; border-radius: 4px; padding: 5px 9px; cursor: pointer; font: inherit; }
      button:hover:not(:disabled) { background: #243446; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      button.active { background: #2c4a63; border-color: #4d7ba8; color: #eaf2fb; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .seg { display: flex; gap: 4px; flex-wrap: wrap; }
      .seg button { padding: 4px 7px; }
      #sankey { flex: 1; min-height: 0; display: block; width: 100%; touch-action: none; }
      #sankey text { fill: #cdd6e0; font: 11px ui-monospace, monospace; pointer-events: none; }
      #sankey .band { cursor: ns-resize; }
      .sub { color: #6b7a8d; font-size: 11px; }
      .spec { color: #7f8fa3; font-size: 10.5px; }
      .cool { color: #e0a45a; font-size: 11px; }
      .agg { color: #ff6b6b; } .rec { color: #5aa9ff; } .def { color: #5ad17a; }
      #readout { position: absolute; left: 10px; bottom: 10px; background: #0e141bdd; border: 1px solid #243140; border-radius: 6px; padding: 8px 10px; max-width: 380px; pointer-events: none; }
      #notice { position: absolute; left: 10px; top: 10px; background: #0e141bdd; border: 1px solid #243140; border-radius: 6px; padding: 6px 10px; }
      #econ { position: absolute; left: 10px; top: 44px; background: #0e141bdd; border: 1px solid #2f5236; border-radius: 6px; padding: 6px 11px; color: #d6efb8; font-size: 14px; letter-spacing: .3px; }
      #title { position: absolute; right: 10px; top: 10px; color: #6b7a8d; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="left">
        <h4>Budget flow</h4>
        <svg id="sankey"></svg>
        <div class="sub">drag a <b>camp band</b> to set its % of income · drag a <b>unit band</b> to set that camp's mix</div>
      </div>
      <div id="stage">
        <div id="notice"></div>
        <div id="econ">⛃ —</div>
        <div id="title">agiwar · author generals, not clicks</div>
        <div id="readout">hover a unit to inspect it</div>
      </div>
      <div id="controls">
        <div id="camps"></div>
        <div class="panel">
          <h4 id="fg-label">Field General</h4>
          <div class="sub">Live, event-gated overrides — then units revert to native training.</div>
          <textarea id="fg-prompt"></textarea>
          <div class="row">
            <button id="fg-rebrief">Re-brief</button>
            <button data-order="push">Push all</button>
            <button data-order="defend">Recall all</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
