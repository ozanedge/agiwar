<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AGIWAR — autonomous battle command</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg-deep: #02060a;
        --bg-panel: rgba(8, 14, 22, 0.85);
        --grid: rgba(0, 255, 209, 0.06);
        --accent: #00ffd1;
        --accent-dim: #16b39a;
        --warn: #ffb547;
        --danger: #ff3860;
        --text: #d8f6f0;
        --edge: rgba(0, 255, 209, 0.25);
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 12px/1.45 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg-deep); color: var(--text); letter-spacing: .01em; }
      /* mission-control grid + scanlines over everything (clicks pass through) */
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
        background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 46px 46px; }
      body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 51; mix-blend-mode: screen;
        background: repeating-linear-gradient(to bottom, rgba(0,255,209,.022) 0, rgba(0,255,209,.022) 1px, transparent 1px, transparent 3px); }

      #app { display: grid; grid-template-columns: 332px 1fr 320px; grid-template-rows: 1fr 248px; height: 100vh; }
      #left { grid-column: 1; grid-row: 1; border-right: 1px solid var(--edge); padding: 12px; background: var(--bg-panel); backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; box-shadow: inset 0 0 40px rgba(0,255,209,.04); }
      #left h4 { margin: 0; }
      #stage { position: relative; grid-column: 2; grid-row: 1; overflow: hidden; min-height: 0; box-shadow: inset 0 0 80px rgba(0,255,209,.05); }
      /* cinematic lighting: soft top light + edge vignette over the battlefield */
      #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 30;
        background: radial-gradient(130% 80% at 50% 8%, rgba(120,200,255,.07), transparent 42%),
                    radial-gradient(150% 130% at 50% 55%, transparent 52%, rgba(1,4,8,.6)); }
      /* full-width bottom strip; 6 equal flex cards fill it */
      #controls { grid-column: 1 / 4; grid-row: 2; display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--edge); align-items: stretch; background: var(--bg-panel); backdrop-filter: blur(6px); }
      .cmd { box-sizing: border-box; flex: 1 1 0; min-width: 0; border: 1px solid var(--edge); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 0 14px rgba(0,255,209,.05); }
      .cmd h4 { font-size: 11px; }
      .cmd .mem { flex: 1; min-height: 0; overflow-y: auto; white-space: pre-wrap; font-size: 10px; line-height: 1.35; color: #9db8b2; border-left: 2px solid var(--accent-dim); padding: 3px 6px; background: rgba(0,255,209,.03); }
      .cmd h4 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cmd .cmdrow { display: flex; gap: 4px; }
      .cmd input { flex: 1; min-width: 0; background: #04090e; color: var(--text); border: 1px solid rgba(0,255,209,.18); border-radius: 4px; padding: 4px 6px; font: inherit; }
      .cmd input:focus { outline: none; border-color: var(--accent); }
      .cmd .send { padding: 4px 8px; }
      #right { grid-column: 3; grid-row: 1; border-left: 1px solid var(--edge); padding: 12px; background: var(--bg-panel); backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 8px; min-height: 0; box-shadow: inset 0 0 40px rgba(0,255,209,.04); }
      #invest { display: flex; flex-direction: column; gap: 5px; }
      #invest button { display: flex; justify-content: space-between; gap: 8px; text-align: left; }
      #fglog { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; font-size: 11px; }
      .logline { border-left: 2px solid var(--accent-dim); padding: 3px 7px; background: rgba(0,255,209,.04); color: #b9d6cf; }
      .logline b { color: var(--accent); }
      .logline .t { color: #5b6b6a; }
      .panel { background: rgba(6, 12, 20, 0.6); border: 1px solid var(--edge); border-radius: 6px; padding: 9px; min-width: 224px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,255,209,.04), 0 0 18px rgba(0,255,209,.05); }
      #camps { display: flex; gap: 10px; }
      h4 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 7px rgba(0,255,209,.5); }
      textarea { width: 100%; flex: 1; min-height: 64px; background: #04090e; color: var(--text); border: 1px solid rgba(0,255,209,.18); border-radius: 4px; padding: 6px; resize: none; font: inherit; }
      textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,209,.2); }
      button { background: rgba(0,255,209,.06); color: var(--text); border: 1px solid rgba(0,255,209,.28); border-radius: 4px; padding: 5px 9px; cursor: pointer; font: inherit; transition: background .12s, box-shadow .12s; }
      button:hover:not(:disabled) { background: rgba(0,255,209,.16); box-shadow: 0 0 10px rgba(0,255,209,.25); }
      button:disabled { opacity: .4; cursor: not-allowed; }
      button.active { background: rgba(0,255,209,.22); border-color: var(--accent); color: #eafffb; box-shadow: 0 0 10px rgba(0,255,209,.3); }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .seg { display: flex; gap: 4px; flex-wrap: wrap; }
      .seg button { padding: 4px 7px; }
      #sankey { flex: 0 0 auto; height: 50vh; display: block; width: 100%; touch-action: none; }
      #sankey text { fill: var(--text); font: 11px "JetBrains Mono", monospace; pointer-events: none; }
      #sankey .band { cursor: ns-resize; }
      .sub { color: rgba(0,255,209,.45); font-size: 11px; }
      #invest { display: flex; flex-direction: column; gap: 6px; }
      .up { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border: 1px solid rgba(0,255,209,.16); border-radius: 6px; background: rgba(0,255,209,.04); }
      .up .ico { width: 20px; height: 20px; flex: 0 0 20px; display: flex; align-items: center; justify-content: center; border-radius: 5px; background: rgba(0,255,209,.1); color: var(--accent); font-size: 12px; text-shadow: 0 0 6px rgba(0,255,209,.6); }
      .up .nm { flex: 1; font-size: 11px; color: var(--text); line-height: 1.25; }
      .up .nm small { display: block; color: #6b7a8d; font-size: 9.5px; }
      .up .meter { display: flex; gap: 2px; }
      .up .meter i { width: 6px; height: 6px; border-radius: 1px; background: rgba(0,255,209,.12); }
      .up .meter i.on { background: var(--accent); box-shadow: 0 0 5px rgba(0,255,209,.7); }
      .up .lv { min-width: 30px; text-align: right; color: var(--accent); font-weight: 700; font-size: 11px; text-shadow: 0 0 6px rgba(0,255,209,.4); }
      .spec { color: var(--accent-dim); font-size: 10.5px; }
      .cool { color: var(--warn); font-size: 11px; text-shadow: 0 0 6px rgba(255,181,71,.5); }
      .agg { color: #ff5d73; } .rec { color: #5ab0ff; } .def { color: #2fe0bd; } .bld { color: #ffb547; }
      .panel-overlay { position: absolute; background: var(--bg-panel); backdrop-filter: blur(6px); border: 1px solid var(--edge); border-radius: 6px; box-shadow: 0 0 18px rgba(0,255,209,.07); }
      #readout { left: 12px; bottom: 12px; padding: 9px 11px; max-width: 380px; pointer-events: none; }
      #notice { left: 12px; top: 12px; padding: 7px 11px; color: var(--accent); }
      #econ { left: 12px; top: 50px; padding: 7px 12px; color: var(--accent); font-size: 14px; letter-spacing: .04em; text-shadow: 0 0 8px rgba(0,255,209,.45); border-color: rgba(0,255,209,.35); }
      #title { right: 14px; top: 12px; font-size: 17px; font-weight: 700; letter-spacing: .34em; color: var(--accent); text-shadow: 0 0 12px rgba(0,255,209,.6); pointer-events: none; }
      #endscreen { position: absolute; inset: 0; z-index: 45; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; pointer-events: none; background: radial-gradient(circle at center, rgba(2,6,10,.45), rgba(2,6,10,.78)); }
      #endscreen.show { display: flex; animation: endfade .5s ease both; }
      #endscreen .big { font-size: 13vw; font-weight: 700; letter-spacing: .32em; line-height: 1; transform-origin: center; animation: endin 1.05s cubic-bezier(.16,.9,.24,1) both; }
      #endscreen .end2 { font-size: 15px; letter-spacing: .22em; color: var(--text); opacity: 0; animation: endfade .7s ease .75s forwards; }
      #endscreen.win .big { color: var(--accent); text-shadow: 0 0 60px rgba(0,255,209,.7), 0 0 18px rgba(0,255,209,.95); }
      #endscreen.lose .big { color: var(--danger); text-shadow: 0 0 60px rgba(255,56,96,.7), 0 0 18px rgba(255,56,96,.95); }
      @keyframes endfade { from { opacity: 0 } to { opacity: 1 } }
      @keyframes endin { 0% { opacity: 0; transform: scale(.55); filter: blur(12px) } 55% { opacity: 1 } 100% { opacity: 1; transform: scale(1); filter: blur(0) } }
      #title small { display: block; font-size: 9px; letter-spacing: .18em; color: rgba(0,255,209,.45); text-shadow: none; text-align: right; margin-top: 2px; }
      * { scrollbar-width: thin; scrollbar-color: rgba(0,255,209,.18) transparent; }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-thumb { background: rgba(0,255,209,.18); border-radius: 4px; }
      *::-webkit-scrollbar-thumb:hover { background: rgba(0,255,209,.32); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="left">
        <h4>Budget flow</h4>
        <svg id="sankey"></svg>
        <div class="sub">set live by your Investment Advisor</div>
        <h4 style="margin-top: 10px">Upgrades</h4>
        <div id="invest"></div>
      </div>
      <div id="stage">
        <div id="notice" class="panel-overlay"></div>
        <div id="econ" class="panel-overlay">⛃ —</div>
        <div id="title">AGIWAR<small>autonomous battle command</small></div>
        <div id="readout" class="panel-overlay">hover a unit to inspect it</div>
        <div id="endscreen"></div>
      </div>
      <div id="controls"></div>
      <div id="right">
        <h4>Command log</h4>
        <div id="fglog"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
