<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AGIWAR — autonomous battle command</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg-deep: #02060a;
        --bg-panel: rgba(8, 14, 22, 0.85);
        --grid: rgba(0, 255, 209, 0.06);
        --accent: #00ffd1;
        --accent-dim: #16b39a;
        --warn: #ffb547;
        --danger: #ff3860;
        --text: #d8f6f0;
        --edge: rgba(0, 255, 209, 0.25);
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 12px/1.45 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg-deep); color: var(--text); letter-spacing: .01em; }
      /* mission-control grid + scanlines over everything (clicks pass through) */
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
        background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 46px 46px; }
      body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 51; mix-blend-mode: screen;
        background: repeating-linear-gradient(to bottom, rgba(0,255,209,.022) 0, rgba(0,255,209,.022) 1px, transparent 1px, transparent 3px); }

      #app { display: grid; grid-template-columns: 332px 1fr 320px; grid-template-rows: 40px 1fr 248px; height: 100vh; }
      /* full-width morale bar across the very top */
      #topbar { grid-column: 1 / 4; grid-row: 1; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--edge); background: var(--bg-panel); backdrop-filter: blur(6px); box-shadow: inset 0 0 30px rgba(0,255,209,.05); }
      #topbar .tbl { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 7px rgba(0,255,209,.5); white-space: nowrap; }
      #topbar .mbar { flex: 1; height: 12px; }
      #topbar #mpct { white-space: nowrap; min-width: 96px; text-align: right; }
      #topbar #mboost { white-space: nowrap; }
      #left { grid-column: 1; grid-row: 2; border-right: 1px solid var(--edge); padding: 12px; background: var(--bg-panel); backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,255,209,.04); }
      #left .lscroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
      #left #mboost { flex: 0 0 auto; width: 100%; justify-content: center; padding: 9px; border-color: var(--accent); color: #eafffb; }
      #left #mboost:hover:not(:disabled) { background: rgba(0,255,209,.16); box-shadow: 0 0 12px rgba(0,255,209,.3); }
      #left h4 { margin: 0; }
      #stage { position: relative; grid-column: 2; grid-row: 2; overflow: hidden; min-height: 0; box-shadow: inset 0 0 80px rgba(0,255,209,.05); }
      /* cinematic lighting: soft top light + edge vignette over the battlefield */
      #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 30;
        background: radial-gradient(130% 80% at 50% 8%, rgba(120,200,255,.07), transparent 42%),
                    radial-gradient(150% 130% at 50% 55%, transparent 52%, rgba(1,4,8,.6)); }
      /* full-width bottom strip; 6 equal flex cards fill it */
      #controls { grid-column: 1 / 4; grid-row: 3; display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--edge); align-items: stretch; background: var(--bg-panel); backdrop-filter: blur(6px); }
      /* the single ORDERS console — bottom-left, broadcasts to the whole staff */
      .orders { box-sizing: border-box; flex: 0 0 312px; min-width: 0; display: flex; flex-direction: column; gap: 7px; padding: 10px; border: 1px solid var(--accent); border-radius: 8px; background: linear-gradient(180deg, rgba(0,255,209,.07), rgba(0,255,209,.02)); box-shadow: 0 0 22px rgba(0,255,209,.14), inset 0 0 24px rgba(0,255,209,.05); }
      .orders .ordhd { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #eafffb; text-shadow: 0 0 8px rgba(0,255,209,.4); }
      .orders .ordhd .ordsub { font-weight: 400; letter-spacing: .02em; color: var(--accent-dim); font-size: 10px; }
      .orders textarea { flex: 1; min-height: 0; resize: none; background: #03080d; color: var(--text); border: 1px solid rgba(0,255,209,.3); border-radius: 5px; padding: 8px 9px; font: inherit; line-height: 1.4; }
      .orders textarea::placeholder { color: #5d7570; }
      .orders textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,209,.25); }
      .orders .send { padding: 8px; justify-content: center; border-color: var(--accent); color: #eafffb; font-weight: 600; }
      .orders .send:hover { background: rgba(0,255,209,.16); box-shadow: 0 0 12px rgba(0,255,209,.3); }
      .cmd { box-sizing: border-box; flex: 1 1 0; min-width: 0; border: 1px solid var(--edge); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 0 14px rgba(0,255,209,.05); }
      .cmd .cmdhd { display: flex; align-items: center; gap: 7px; min-width: 0; }
      .cmd .cmdhd .av { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 9px; filter: drop-shadow(0 0 5px rgba(0,255,209,.18)); }
      .cmd .cmdhd h4 { flex: 1; min-width: 0; }
      .cmd h4 { font-size: 11px; }
      .cmd .mem { flex: 1; min-height: 0; overflow-y: auto; white-space: pre-wrap; font-size: 10px; line-height: 1.35; color: #9db8b2; border-left: 2px solid var(--accent-dim); padding: 3px 6px; background: rgba(0,255,209,.03); }
      .cmd h4 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cmd .cmdrow { display: flex; gap: 4px; }
      .cmd input { flex: 1; min-width: 0; background: #04090e; color: var(--text); border: 1px solid rgba(0,255,209,.18); border-radius: 4px; padding: 4px 6px; font: inherit; }
      .cmd input:focus { outline: none; border-color: var(--accent); }
      .cmd .send { padding: 4px 8px; }
      #right { grid-column: 3; grid-row: 2; border-left: 1px solid var(--edge); padding: 12px; background: var(--bg-panel); backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 8px; min-height: 0; box-shadow: inset 0 0 40px rgba(0,255,209,.04); }
      #invest { display: flex; flex-direction: column; gap: 5px; }
      #invest button { display: flex; justify-content: space-between; gap: 8px; text-align: left; }
      #fglog { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; font-size: 11px; }
      .logline { border-left: 2px solid var(--accent-dim); padding: 3px 7px; background: rgba(0,255,209,.04); color: #b9d6cf; }
      .logline b { color: var(--accent); }
      .logline .t { color: #5b6b6a; }
      .panel { background: rgba(6, 12, 20, 0.6); border: 1px solid var(--edge); border-radius: 6px; padding: 9px; min-width: 224px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,255,209,.04), 0 0 18px rgba(0,255,209,.05); }
      #camps { display: flex; gap: 10px; }
      h4 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 7px rgba(0,255,209,.5); }
      textarea { width: 100%; flex: 1; min-height: 64px; background: #04090e; color: var(--text); border: 1px solid rgba(0,255,209,.18); border-radius: 4px; padding: 6px; resize: none; font: inherit; }
      textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,209,.2); }
      button { background: rgba(0,255,209,.06); color: var(--text); border: 1px solid rgba(0,255,209,.28); border-radius: 4px; padding: 5px 9px; cursor: pointer; font: inherit; transition: background .12s, box-shadow .12s; }
      button:hover:not(:disabled) { background: rgba(0,255,209,.16); box-shadow: 0 0 10px rgba(0,255,209,.25); }
      button:disabled { opacity: .4; cursor: not-allowed; }
      button.active { background: rgba(0,255,209,.22); border-color: var(--accent); color: #eafffb; box-shadow: 0 0 10px rgba(0,255,209,.3); }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .seg { display: flex; gap: 4px; flex-wrap: wrap; }
      .seg button { padding: 4px 7px; }
      #sankey { flex: 0 0 auto; height: 34vh; display: block; width: 100%; touch-action: none; }
      #sankey text { fill: var(--text); font: 11px "JetBrains Mono", monospace; pointer-events: none; }
      #sankey .band { cursor: ns-resize; }
      .sub { color: rgba(0,255,209,.45); font-size: 11px; }
      #invest { display: flex; flex-direction: column; gap: 6px; }
      .up { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border: 1px solid rgba(0,255,209,.16); border-radius: 6px; background: rgba(0,255,209,.04); cursor: pointer; transition: background .12s, border-color .12s, box-shadow .12s, opacity .12s; }
      .up:hover { border-color: rgba(0,255,209,.5); background: rgba(0,255,209,.09); }
      .up.queued { border-color: var(--accent); background: rgba(0,255,209,.12); box-shadow: 0 0 12px rgba(0,255,209,.3); }
      .up.paused { opacity: .42; }
      .up .upq { min-width: 56px; text-align: right; font-size: 9.5px; color: #6b7a8d; }
      .up.queued .upq { color: var(--accent); font-weight: 700; }
      .up .upq b { color: var(--danger); margin-left: 3px; }
      .up .ico { width: 20px; height: 20px; flex: 0 0 20px; display: flex; align-items: center; justify-content: center; border-radius: 5px; background: rgba(0,255,209,.1); color: var(--accent); font-size: 12px; text-shadow: 0 0 6px rgba(0,255,209,.6); }
      .up .nm { flex: 1; font-size: 11px; color: var(--text); line-height: 1.25; }
      .up .nm small { display: block; color: #6b7a8d; font-size: 9.5px; }
      .up .meter { display: flex; gap: 2px; }
      .up .meter i { width: 6px; height: 6px; border-radius: 1px; background: rgba(0,255,209,.12); }
      .up .meter i.on { background: var(--accent); box-shadow: 0 0 5px rgba(0,255,209,.7); }
      .up .lv { min-width: 30px; text-align: right; color: var(--accent); font-weight: 700; font-size: 11px; text-shadow: 0 0 6px rgba(0,255,209,.4); }
      .spec { color: var(--accent-dim); font-size: 10.5px; }
      .cool { color: var(--warn); font-size: 11px; text-shadow: 0 0 6px rgba(255,181,71,.5); }
      .agg { color: #ff5d73; } .rec { color: #5ab0ff; } .def { color: #2fe0bd; } .bld { color: #ffb547; }
      .panel-overlay { position: absolute; background: var(--bg-panel); backdrop-filter: blur(6px); border: 1px solid var(--edge); border-radius: 6px; box-shadow: 0 0 18px rgba(0,255,209,.07); }
      #readout { left: 12px; bottom: 12px; padding: 0; width: 300px; pointer-events: none; overflow: hidden; }
      #readout > .sub { display: block; padding: 9px 11px; }
      /* ---- unit inspect card ---- */
      .uc { font-size: 11px; line-height: 1.3; }
      .uc-hd { display: flex; align-items: center; gap: 6px; padding: 9px 11px 7px; background: linear-gradient(180deg, rgba(0,255,209,.08), transparent); border-bottom: 1px solid var(--edge); }
      .uc-name { font-weight: 700; font-size: 13px; color: #eafffb; letter-spacing: .02em; }
      .uc-id { color: var(--accent-dim); font-size: 10px; }
      .uc-badge { margin-left: auto; font-size: 9px; font-weight: 700; letter-spacing: .08em; padding: 1px 6px; border: 1px solid; border-radius: 4px; }
      .uc-pin { font-size: 9px; color: var(--accent-dim); }
      .uc-doctrine { padding: 6px 11px 0; display: flex; align-items: center; gap: 6px; }
      .uc-doc { font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: .06em; }
      .uc-doc.agg { color: #ff5d73; } .uc-doc.rec { color: #5ab0ff; } .uc-doc.def { color: #2fe0bd; } .uc-doc.bld { color: #ffb547; }
      .uc-ovr { color: #ffd76b; font-size: 10px; font-weight: 600; }
      .uc-hpbar { position: relative; height: 16px; margin: 8px 11px 2px; border-radius: 4px; background: #0a1218; border: 1px solid rgba(255,255,255,.08); overflow: hidden; }
      .uc-hpfill { position: absolute; inset: 0 auto 0 0; border-radius: 3px 0 0 3px; transition: width .25s ease, background .25s ease; }
      .uc-hptxt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #04090e; text-shadow: 0 0 3px rgba(255,255,255,.4); }
      .uc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--edge); margin: 8px 0 0; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
      .uc-stat { display: flex; flex-direction: column; gap: 1px; padding: 5px 11px; background: var(--bg-panel); }
      .uc-k { color: #6f8a85; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; }
      .uc-v { color: #eafffb; font-weight: 600; font-size: 12px; }
      .uc-d { color: var(--accent); font-size: 10px; margin-left: 4px; font-weight: 700; }
      .uc-ups { padding: 8px 11px 7px; }
      .uc-ups-h { color: var(--accent); font-size: 9px; font-weight: 700; letter-spacing: .09em; margin-bottom: 5px; }
      .uc-up { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
      .uc-upi { width: 15px; text-align: center; }
      .uc-upn { color: #cfe; font-weight: 600; min-width: 64px; }
      .uc-uplv { color: var(--accent); font-weight: 700; font-size: 10px; min-width: 30px; }
      .uc-upe { color: #9db8b2; font-size: 10px; }
      .uc-up.off { opacity: .32; }
      .uc-up.off .uc-uplv { color: #6f8a85; }
      .uc-foot { padding: 6px 11px 8px; border-top: 1px solid var(--edge); color: #6f8a85; font-size: 10px; }
      .uc .hi { color: #ffd76b; }
      /* top-left HUD stack: title → resource chip → notice, each clearly below the last (no overlap) */
      #title { flex: 0 0 auto; font-size: 16px; font-weight: 700; letter-spacing: .22em; color: var(--accent); text-shadow: 0 0 12px rgba(0,255,209,.6); line-height: 1; }
      #econ { left: 16px; top: 56px; padding: 7px 12px; color: var(--accent); font-size: 14px; letter-spacing: .04em; text-shadow: 0 0 8px rgba(0,255,209,.45); border-color: rgba(0,255,209,.35); }
      #notice { left: 16px; top: 96px; padding: 7px 11px; color: var(--accent); max-width: 340px; }
      #notice:empty { display: none; } /* no stray empty bordered box when there's nothing to show */
      #endscreen { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; pointer-events: none; background: radial-gradient(circle at center, rgba(2,6,10,.45), rgba(2,6,10,.82)); }
      #endscreen.show { display: flex; animation: endfade .5s ease both; }
      #endscreen .big { font-size: clamp(40px, 11vw, 180px); font-weight: 700; letter-spacing: .12em; line-height: 1; white-space: nowrap; max-width: 96vw; transform-origin: center; animation: endin 1.05s cubic-bezier(.16,.9,.24,1) both; }
      #endscreen .end2 { font-size: 15px; letter-spacing: .22em; color: var(--text); opacity: 0; animation: endfade .7s ease .75s forwards; }
      #endscreen .endbtns { display: flex; gap: 14px; margin-top: 8px; pointer-events: auto; opacity: 0; animation: endfade .6s ease 1.1s forwards; }
      #endscreen .endbtns button { padding: 11px 20px; font-size: 13px; letter-spacing: .06em; border-color: var(--accent); color: #eafffb; background: rgba(0,255,209,.08); }
      #endscreen .endbtns button:hover { background: rgba(0,255,209,.2); box-shadow: 0 0 16px rgba(0,255,209,.35); }
      #endscreen.win .big { color: var(--accent); text-shadow: 0 0 60px rgba(0,255,209,.7), 0 0 18px rgba(0,255,209,.95); }
      #endscreen.lose .big { color: var(--danger); text-shadow: 0 0 60px rgba(255,56,96,.7), 0 0 18px rgba(255,56,96,.95); }
      @keyframes endfade { from { opacity: 0 } to { opacity: 1 } }
      @keyframes endin { 0% { opacity: 0; transform: scale(.55); filter: blur(12px) } 55% { opacity: 1 } 100% { opacity: 1; transform: scale(1); filter: blur(0) } }
      #title small { display: block; font-size: 9px; letter-spacing: .18em; color: rgba(0,255,209,.45); text-shadow: none; text-align: left; margin-top: 2px; }
      /* matchmaking search screen */
      #matchmaking { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, rgba(2,6,10,.82), rgba(2,6,10,.96)); backdrop-filter: blur(4px); }
      .mmpanel { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 28px 34px; border: 1px solid var(--edge); border-radius: 12px; background: var(--bg-panel); box-shadow: 0 0 44px rgba(0,255,209,.14); }
      .mmpanel h3 { margin: 0; color: var(--accent); letter-spacing: .14em; text-transform: uppercase; font-size: 15px; text-shadow: 0 0 10px rgba(0,255,209,.5); }
      .mmspin { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(0,255,209,.18); border-top-color: var(--accent); animation: mmspin 0.9s linear infinite; box-shadow: 0 0 14px rgba(0,255,209,.3); }
      @keyframes mmspin { to { transform: rotate(360deg); } }
      .mmtimer { font-size: 52px; font-weight: 700; line-height: 1; color: var(--text); letter-spacing: .04em; text-shadow: 0 0 18px rgba(0,255,209,.4); font-variant-numeric: tabular-nums; }
      .mmsub { color: rgba(0,255,209,.5); font-size: 11px; max-width: 320px; line-height: 1.5; }
      .mmskip { margin-top: 6px; padding: 9px 18px; font-size: 12px; letter-spacing: .06em; border-color: var(--accent); color: #eafffb; }
      .mmskip:hover:not(:disabled) { background: rgba(0,255,209,.18); box-shadow: 0 0 14px rgba(0,255,209,.3); }
      /* army doctrine picker (match start) */
      #doctrine { position: absolute; inset: 0; z-index: 46; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, rgba(2,6,10,.72), rgba(2,6,10,.92)); backdrop-filter: blur(3px); }
      .dpanel { position: relative; width: min(880px, 92%); border: 1px solid var(--edge); border-radius: 10px; background: var(--bg-panel); padding: 18px; box-shadow: 0 0 40px rgba(0,255,209,.12); }
      .dtimer { position: absolute; top: 16px; right: 18px; width: 48px; height: 48px; }
      .dtimer .trk { fill: none; stroke: rgba(0,255,209,.14); stroke-width: 3; }
      .dtimer .ring { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; filter: drop-shadow(0 0 4px rgba(0,255,209,.6)); }
      .dtimer text { fill: var(--text); font: 700 14px "JetBrains Mono", monospace; text-anchor: middle; }
      .dpanel h3 { margin: 0 0 2px; color: var(--accent); letter-spacing: .14em; text-transform: uppercase; font-size: 15px; text-shadow: 0 0 10px rgba(0,255,209,.5); }
      .dsub { color: rgba(0,255,209,.5); font-size: 11px; margin-bottom: 14px; }
      .dcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .dcard { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 11px 12px; border: 1px solid rgba(0,255,209,.2); border-radius: 8px; background: rgba(0,255,209,.04); cursor: pointer; transition: background .12s, box-shadow .12s, transform .08s; }
      .dcard:hover { background: rgba(0,255,209,.12); box-shadow: 0 0 16px rgba(0,255,209,.25); transform: translateY(-2px); }
      .dcard.cur { border-color: var(--accent); box-shadow: 0 0 12px rgba(0,255,209,.3); }
      .dcard .dl { color: #eafffb; font-weight: 700; font-size: 13px; letter-spacing: .04em; }
      .dcard .dh { color: var(--accent); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
      .dcard .db { color: #9db8b2; font-size: 10.5px; line-height: 1.4; }
      /* strategic fork banner (a commander asks for a decision) */
      #decision { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 44; width: min(560px, 78%); border: 1px solid var(--accent); border-radius: 9px; background: var(--bg-panel); backdrop-filter: blur(6px); padding: 11px 13px 9px; box-shadow: 0 0 26px rgba(0,255,209,.22); animation: endfade .25s ease both; }
      /* three clear bands: big title, then the situation, then the choices */
      #decision .dtitle { font-size: 17px; font-weight: 700; letter-spacing: .02em; color: var(--accent); text-shadow: 0 0 10px rgba(0,255,209,.5); text-align: center; }
      #decision .dquestion { font-size: 14px; color: #eafffb; line-height: 1.45; text-align: center; margin: 7px auto 12px; max-width: 90%; }
      #decision .dopts { display: flex; gap: 8px; align-items: stretch; }
      #decision .dopt { flex: 1; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 7px 9px; border-radius: 6px; }
      #decision .dopt b { font-size: 11.5px; color: #eafffb; }
      #decision .dopt small { font-size: 9.5px; color: #9db8b2; line-height: 1.3; }
      #decision .dopt-skip { flex: 0 0 auto; max-width: 140px; border-style: dashed; opacity: .7; background: transparent; }
      #decision .dopt-skip:hover { opacity: 1; }
      #decision .dopt-skip b { color: #9db8b2; }
      #decision .dcd { height: 2px; margin-top: 9px; background: rgba(0,255,209,.12); border-radius: 2px; overflow: hidden; }
      #decision .dcd i { display: block; height: 100%; width: 100%; background: var(--accent); box-shadow: 0 0 6px rgba(0,255,209,.7); }
      .mbar { height: 9px; border-radius: 5px; background: rgba(0,255,209,.08); border: 1px solid rgba(0,255,209,.18); overflow: hidden; }
      .mbar i { display: block; height: 100%; width: 70%; border-radius: 4px; transition: width .25s ease, background .25s ease; box-shadow: 0 0 8px currentColor; }
      #mboost { display: flex; align-items: center; gap: 6px; }
      #mpct { float: right; }
      * { scrollbar-width: thin; scrollbar-color: rgba(0,255,209,.18) transparent; }
