apiVersion: v1
kind: Service
metadata:
  name: agiwar-server
  annotations:
    # Network Load Balancer suits long-lived WebSocket connections well.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector: { app: agiwar-server }
  ports:
    - name: ws
      port: 443
      targetPort: 8787
      protocol: TCP
